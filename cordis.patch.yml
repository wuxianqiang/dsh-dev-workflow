# Web disables the workflow engine by default. Restore the same row
# supplied by dsh-base, including its provider configuration.
# Patch rows replace the targeted row's whole configuration rather than
# deep-merging it, so provider: spawn is restated here.
- id: workflow-ptc
  name: '@deepseek-ai/dsh-workflow-ptc'
  disabled: false
  config:
    provider: spawn

- insert:
    - id: dsh-dev-workflow
      name: dsh-dev-workflow
