# Register the packaged development workflow Skills with DSH.
# This follows the standard Skill-only bundle pattern.
- insert:
    - id: dsh-dev-workflow-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: dsh-dev-workflow-plugin
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-dev-workflow/package.json')), 'skills')
